name: USB Storage to SATA reference core

on:
  push:
    paths:
      - "Src/lv2/usb-storage-to-sata/**"
      - "Src/lv3/usb-storage-to-sata/**"
      - ".github/workflows/usb-storage-to-sata.yml"
  pull_request:
    paths:
      - "Src/lv2/usb-storage-to-sata/**"
      - "Src/lv3/usb-storage-to-sata/**"
      - ".github/workflows/usb-storage-to-sata.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          if [ -d Src/lv3/usb-storage-to-sata ]; then
            make -C Src/lv3/usb-storage-to-sata test
          else
            make -C Src/lv2/usb-storage-to-sata test
          fi
